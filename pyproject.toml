[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman_filter"
version = "0.1.0"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Kalman filters (KF, EKF, UKF, and iterated variants) with directly accessible parameters."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/KalmanFilter"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/KalmanFilter/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalman_filter = ["py.typed"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Test directories have no __init__.py; name their modules by path so conftest.py files do not collide.
explicit_package_bases = true
mypy_path = "src"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.pep8-naming]
# Standard Kalman filter notation.
ignore-names = ["F", "Q", "H", "R", "S", "K", "P", "*_P"]
